<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Department Users â€” CRMC CampusConnect Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>
  <script src="admin-utils.js"></script>
</head>
<body>

<aside class="admin-sidebar">
  <div class="sidebar-header">
    <img src="../Images/logo.png" alt="CRMC Logo" class="sidebar-logo" />
    <div class="sidebar-brand"><span class="brand-crmc">CRMC</span><span class="brand-cc">CampusConnect</span></div>
  </div>
  <nav class="sidebar-nav">
    <a href="dept-dashboard.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Dashboard</span></a>
    <a href="dept-users.html" class="nav-item active"><i class="fas fa-users"></i><span><span class="deptLabel">Dept</span> Users</span></a>
    <a href="dept-posts.html" class="nav-item"><i class="fas fa-newspaper"></i><span><span class="deptLabel">Dept</span> Posts</span></a>
    <a href="dept-moderation.html" class="nav-item"><i class="fas fa-flag"></i><span>Moderation</span></a>
    <a href="dept-analytics.html" class="nav-item"><i class="fas fa-chart-bar"></i><span>Analytics</span></a>
  </nav>
  <div class="sidebar-footer">
    <button class="nav-item nav-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button>
  </div>
</aside>

<main class="admin-main">
  <header class="admin-topbar">
    <div>
      <h1 class="page-title" id="pageTitle">Department Users</h1>
      <p style="color:var(--gray-600);font-size:14px;margin-top:4px;" id="pageSubtitle">Manage students in your department</p>
    </div>
    <div class="topbar-right">
      <div class="admin-profile">
        <div class="admin-avatar" id="adminAvatar">DA</div>
        <div>
          <div class="admin-name" id="adminName">Loading...</div>
          <div class="admin-role" id="adminRoleText">Dept Admin</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Filter Tabs -->
  <div class="filter-tabs">
    <button class="tab-btn active" data-filter="all"><i class="fas fa-users"></i> All <span id="countAll">(0)</span></button>
    <button class="tab-btn" data-filter="pending"><i class="fas fa-clock"></i> Pending <span id="countPending">(0)</span></button>
    <button class="tab-btn" data-filter="approved"><i class="fas fa-check-circle"></i> Approved <span id="countApproved">(0)</span></button>
    <button class="tab-btn" data-filter="suspended"><i class="fas fa-ban"></i> Suspended <span id="countSuspended">(0)</span></button>
  </div>

  <!-- Search -->
  <div class="card" style="margin-top:1.25rem;">
    <div class="card-body">
      <div style="position:relative;">
        <i class="fas fa-search" style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--gray-400);"></i>
        <input type="text" id="searchInput" placeholder="Search by name, email, or student ID..."
          style="width:100%;padding:0.75rem 1rem 0.75rem 2.75rem;border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-size:14px;font-family:Poppins,sans-serif;" />
      </div>
    </div>
  </div>

  <!-- Users Table -->
  <div class="card" style="margin-top:1.25rem;">
    <div class="card-header">
      <h3 class="card-title"><i class="fas fa-users" style="color:var(--maroon);margin-right:0.5rem;"></i> Students</h3>
    </div>
    <div style="overflow-x:auto;">
      <table id="usersTable" style="width:100%;border-collapse:collapse;">
        <thead>
          <tr style="background:var(--gray-50);border-bottom:1px solid var(--gray-200);">
            <th style="padding:0.875rem 1.25rem;text-align:left;font-size:12px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.05em;">Student</th>
            <th style="padding:0.875rem 1.25rem;text-align:left;font-size:12px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.05em;">Student ID</th>
            <th style="padding:0.875rem 1.25rem;text-align:left;font-size:12px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.05em;">Status</th>
            <th style="padding:0.875rem 1.25rem;text-align:left;font-size:12px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.05em;">Joined</th>
            <th style="padding:0.875rem 1.25rem;text-align:left;font-size:12px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.05em;">Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr><td colspan="5" style="text-align:center;padding:3rem;color:var(--gray-400);"><i class="fas fa-spinner fa-spin" style="font-size:1.5rem;"></i><p style="margin-top:0.75rem;">Loading users...</p></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- User Detail Modal -->
<div id="userModal" class="modal-overlay" style="display:none;">
  <div class="modal-content" style="max-width:480px;">
    <div class="modal-header">
      <h3 class="modal-title">Student Profile</h3>
      <button class="modal-close" onclick="document.getElementById('userModal').style.display='none'"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="userModalBody">
      <!-- filled by JS -->
    </div>
    <div class="modal-footer">
      <button onclick="document.getElementById('userModal').style.display='none'"
        style="padding:0.625rem 1.25rem;background:var(--gray-100);border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:Poppins,sans-serif;">
        Close
      </button>
    </div>
  </div>
</div>

<script src="dept-users.js"></script>
</body>
</html>
