<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events — SSG Officer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>
  <script src="admin-utils.js"></script>
</head>
<body>

<aside class="admin-sidebar">
  <div class="sidebar-header">
    <img src="../Images/logo.png" alt="CRMC Logo" class="sidebar-logo" />
    <div class="sidebar-brand">
      <span class="brand-crmc">CRMC</span>
      <span class="brand-cc">CampusConnect</span>
    </div>
  </div>
  <nav class="sidebar-nav">
    <a href="ssg-officer-dashboard.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Dashboard</span></a>
    <a href="ssg-officer-feed.html" class="nav-item"><i class="fas fa-comments"></i><span>SSG Community Feed</span></a>
    <a href="ssg-officer-posts.html" class="nav-item"><i class="fas fa-bullhorn"></i><span>Announcements</span></a>
    <a href="ssg-officer-events.html" class="nav-item active"><i class="fas fa-calendar-check"></i><span>Events</span></a>
    <a href="ssg-officer-moderation.html" class="nav-item"><i class="fas fa-flag"></i><span>Moderation</span></a>
  </nav>
  <div class="sidebar-footer">
    <button class="nav-item nav-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button>
  </div>
</aside>

<main class="admin-main">
  <header class="admin-topbar">
    <div>
      <h1 class="page-title">Campus Events</h1>
      <p style="color:var(--gray-600);font-size:14px;margin-top:4px;">Manage upcoming events shown on the student feed</p>
    </div>
    <div class="topbar-right">
      <button id="addEventBtn" style="padding:.625rem 1.25rem;background:var(--maroon);color:white;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:Poppins,sans-serif;display:flex;align-items:center;gap:.5rem;">
        <i class="fas fa-plus"></i> Add Event
      </button>
      <div class="admin-profile">
        <div class="admin-avatar" id="adminAvatar" style="background:linear-gradient(135deg,#b7950b,#d4ac0d);">SSG</div>
        <div>
          <div class="admin-name" id="adminName">Loading...</div>
          <div class="admin-role">SSG Officer</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Filter Tabs -->
  <div class="filter-tabs">
    <button class="tab-btn active" data-filter="upcoming"><i class="fas fa-calendar-check"></i> Upcoming</button>
    <button class="tab-btn" data-filter="past"><i class="fas fa-history"></i> Past</button>
    <button class="tab-btn" data-filter="all"><i class="fas fa-list"></i> All</button>
  </div>

  <!-- Events Grid -->
  <div id="eventsContainer" style="margin-top:1.5rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.25rem;">
    <div class="card" style="grid-column:1/-1;">
      <div class="card-body" style="text-align:center;padding:3rem;color:var(--gray-400);">
        <i class="fas fa-spinner fa-spin" style="font-size:2rem;"></i>
        <p style="margin-top:1rem;">Loading events...</p>
      </div>
    </div>
  </div>
</main>

<!-- Add / Edit Event Modal -->
<div id="eventModal" class="modal-overlay" style="display:none;">
  <div class="modal-content" style="max-width:480px;">
    <div class="modal-header">
      <h3 class="modal-title" id="eventModalTitle"><i class="fas fa-calendar-plus"></i> Add Event</h3>
      <button class="modal-close" id="closeEventModal"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:1rem;">
      <div>
        <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--gray-700);">Event Title *</label>
        <input type="text" id="eventTitle" placeholder="e.g. Foundation Day Celebration" style="width:100%;padding:.75rem;border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-size:14px;font-family:Poppins,sans-serif;" />
      </div>
      <div>
        <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--gray-700);">Date *</label>
        <input type="date" id="eventDate" style="width:100%;padding:.75rem;border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-size:14px;font-family:Poppins,sans-serif;" />
      </div>
      <div>
        <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--gray-700);">Location</label>
        <input type="text" id="eventLocation" placeholder="e.g. Main Campus Auditorium" style="width:100%;padding:.75rem;border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-size:14px;font-family:Poppins,sans-serif;" />
      </div>
      <div>
        <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--gray-700);">Description (optional)</label>
        <textarea id="eventDescription" rows="3" placeholder="Brief description of the event..." style="width:100%;padding:.75rem;border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-size:14px;font-family:Poppins,sans-serif;resize:vertical;"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button id="cancelEventBtn" style="padding:.625rem 1.25rem;background:var(--gray-100);border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:Poppins,sans-serif;">Cancel</button>
      <button id="submitEventBtn" style="padding:.625rem 1.5rem;background:var(--maroon);color:white;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:Poppins,sans-serif;">
        <i class="fas fa-plus"></i> Add Event
      </button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div id="deleteModal" class="modal-overlay" style="display:none;">
  <div class="modal-content" style="max-width:420px;">
    <div class="modal-body" style="text-align:center;padding:2rem;">
      <div style="width:64px;height:64px;background:#fee2e2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;">
        <i class="fas fa-trash" style="font-size:1.75rem;color:#dc2626;"></i>
      </div>
      <h3 style="font-size:1.25rem;font-weight:700;margin-bottom:.5rem;">Remove Event?</h3>
      <p style="color:var(--gray-600);font-size:14px;">This will hide the event from the student feed.</p>
      <div style="display:flex;gap:.75rem;margin-top:1.5rem;">
        <button id="cancelDeleteBtn" style="flex:1;padding:.75rem;background:var(--gray-100);border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:Poppins,sans-serif;">Cancel</button>
        <button id="confirmDeleteBtn" style="flex:1;padding:.75rem;background:#dc2626;color:white;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:Poppins,sans-serif;">Remove</button>
      </div>
    </div>
  </div>
</div>

<script src="ssg-officer-events.js"></script>
</body>
</html>
