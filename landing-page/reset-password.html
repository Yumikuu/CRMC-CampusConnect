<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — CRMC CampusConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6B0F1A 0%, #8b1525 50%, #a01a2d 100%);
      padding: 1.5rem;
    }
    .reset-card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      text-align: center;
    }
    .reset-logo { width: 56px; margin: 0 auto 1rem; }
    .reset-logo img { width: 100%; }
    .reset-title { font-size: 1.3rem; font-weight: 700; color: #1f2937; margin-bottom: .35rem; }
    .reset-sub { font-size: .82rem; color: #6b7280; margin-bottom: 1.5rem; }
    .form-group { text-align: left; margin-bottom: 1rem; }
    .form-group label { display: block; font-size: .78rem; font-weight: 600; color: #374151; margin-bottom: .35rem; }
    .form-group input {
      width: 100%; padding: .7rem .85rem; border: 1.5px solid #e5e7eb;
      border-radius: 8px; font-family: inherit; font-size: .85rem;
      transition: border-color .15s;
    }
    .form-group input:focus { outline: none; border-color: #6B0F1A; }
    .input-password { position: relative; }
    .input-password input { padding-right: 2.5rem; }
    .toggle-pw {
      position: absolute; right: .75rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #9ca3af;
    }
    .btn-primary {
      width: 100%; padding: .75rem; border: none; border-radius: 8px;
      background: #6B0F1A; color: #fff; font-size: .9rem; font-weight: 700;
      font-family: inherit; cursor: pointer; transition: all .15s;
    }
    .btn-primary:hover { background: #8b1525; }
    .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }
    .error-msg { color: #dc2626; font-size: .78rem; margin-bottom: .75rem; text-align: center; }
    .success-box {
      padding: 1.5rem 0; text-align: center;
    }
    .success-icon {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(34,197,94,.1); display: flex; align-items: center; justify-content: center;
      margin: 0 auto .75rem; font-size: 1.4rem; color: #16a34a;
    }
    .success-box h3 { font-size: 1rem; font-weight: 700; color: #1f2937; margin-bottom: .4rem; }
    .success-box p { font-size: .82rem; color: #6b7280; line-height: 1.5; }
    .success-box a { 
      display: inline-block; margin-top: 1rem; padding: .6rem 1.5rem;
      background: #6B0F1A; color: #fff; border-radius: 8px;
      font-size: .82rem; font-weight: 600; text-decoration: none;
    }
    .success-box a:hover { background: #8b1525; }
  </style>
</head>
<body>

<div class="reset-card">
  <div class="reset-logo"><img src="../Images/logo.png" alt="CRMC CampusConnect" /></div>
  <h1 class="reset-title">Set New Password</h1>
  <p class="reset-sub">Enter your new password below.</p>

  <form id="resetForm">
    <div id="errorMsg" class="error-msg" hidden></div>
    <div class="form-group">
      <label for="newPassword">New Password</label>
      <div class="input-password">
        <input type="password" id="newPassword" placeholder="At least 6 characters" required />
        <button type="button" class="toggle-pw" aria-label="Show password"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <div class="input-password">
        <input type="password" id="confirmPassword" placeholder="Re-enter your password" required />
        <button type="button" class="toggle-pw" aria-label="Show password"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <button type="submit" class="btn-primary" id="submitBtn">Update Password</button>
  </form>
</div>

<script>
  // Toggle password visibility
  document.querySelectorAll('.toggle-pw').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = btn.previousElementSibling;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.querySelector('i').className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
    });
  });

  // Handle password reset form
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');
    errorMsg.hidden = true;

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!newPassword || !confirmPassword) {
      errorMsg.textContent = 'Please fill in both fields.';
      errorMsg.hidden = false;
      return;
    }

    if (newPassword.length < 6) {
      errorMsg.textContent = 'Password must be at least 6 characters.';
      errorMsg.hidden = false;
      return;
    }

    if (newPassword !== confirmPassword) {
      errorMsg.textContent = 'Passwords do not match.';
      errorMsg.hidden = false;
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating...';

    try {
      const { error } = await db.auth.updateUser({ password: newPassword });

      if (error) throw error;

      // Show success
      document.querySelector('.reset-card').innerHTML = `
        <div class="success-box">
          <div class="success-icon"><i class="fas fa-check-circle"></i></div>
          <h3>Password Updated!</h3>
          <p>Your password has been successfully changed. You can now login with your new password.</p>
          <a href="index.html">Go to Login</a>
        </div>
      `;

    } catch (err) {
      console.error('Password update error:', err);
      errorMsg.textContent = err.message || 'Failed to update password. The link may have expired.';
      errorMsg.hidden = false;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update Password';
    }
  });
</script>
</body>
</html>
