<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — CRMC CampusConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --maroon: #6B0F1A;
      --gold: #FFC107;
      --dark: #1a1a1a;
      --gray: #666;
      --light-gray: #f5f5f5;
      --white: #ffffff;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
      width: 100%;
      max-width: 450px;
      animation: fadeInUp 0.5s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      background: linear-gradient(135deg, var(--maroon) 0%, #8B1220 100%);
      padding: 40px 30px;
      text-align: center;
      color: var(--white);
    }

    .login-header img {
      width: 80px;
      height: 80px;
      margin-bottom: 15px;
      object-fit: contain;
    }

    .login-header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .login-header .subtitle {
      font-size: 14px;
      opacity: 0.9;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .login-body {
      padding: 40px 30px;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .alert.error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
    }

    .alert.success {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--dark);
      font-size: 14px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i.fa-lock,
    .input-wrapper i.fa-envelope {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
      font-size: 16px;
      pointer-events: none;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px 14px 45px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      transition: all 0.3s;
    }

    .form-group input[type="password"],
    .form-group input[type="text"].password-field {
      padding-right: 45px;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--maroon);
      box-shadow: 0 0 0 3px rgba(107,15,26,0.1);
    }

    .toggle-password {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
      cursor: pointer;
      font-size: 16px;
      transition: color 0.3s;
      z-index: 10;
      background: transparent;
      border: none;
      padding: 4px;
    }

    .toggle-password:hover {
      color: var(--maroon);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--maroon) 0%, #8B1220 100%);
      color: var(--white);
      border: none;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(107,15,26,0.3);
    }

    .login-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .login-btn .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--white);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .login-btn:disabled .spinner {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .divider {
      margin: 25px 0;
      text-align: center;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #e0e0e0;
    }

    .divider span {
      background: var(--white);
      padding: 0 15px;
      position: relative;
      color: var(--gray);
      font-size: 13px;
    }

    .student-login-link {
      text-align: center;
      margin-top: 20px;
    }

    .student-login-link a {
      color: var(--maroon);
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.3s;
    }

    .student-login-link a:hover {
      color: #8B1220;
      text-decoration: underline;
    }

    .security-note {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 13px;
      color: var(--gray);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .security-note i {
      color: var(--maroon);
    }
  </style>
</head>
<body>

<div class="login-container">
  <!-- Header -->
  <div class="login-header">
    <img src="../Images/logo.png" alt="CRMC Logo" />
    <h1>Admin Portal</h1>
    <div class="subtitle">
      <i class="fas fa-shield-alt"></i>
      <span>CRMC CampusConnect Administration</span>
    </div>
  </div>

  <!-- Body -->
  <div class="login-body">
    <!-- Alert Messages -->
    <div id="alertBox" class="alert"></div>

    <!-- Login Form -->
    <form id="adminLoginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="admin@crmc.edu.ph"
            required 
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password"
            required 
            autocomplete="current-password"
          />
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <span class="spinner"></span>
        <span class="btn-text">Login to Dashboard</span>
      </button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <span>Not an admin?</span>
    </div>

    <!-- Student Login Link -->
    <div class="student-login-link">
      <a href="../landing page/index.html">
        <i class="fas fa-arrow-left"></i> Go to Student Login
      </a>
    </div>

    <!-- Security Note -->
    <div class="security-note">
      <i class="fas fa-info-circle"></i>
      <span>This portal is for authorized administrators only</span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script src="login.js"></script>

</body>
</html>
