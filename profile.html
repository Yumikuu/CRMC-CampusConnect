<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — CRMC CampusConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="campusfeed.css" />
  <link rel="stylesheet" href="profile.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>

<!-- ── TOP NAVBAR ── -->
<nav class="topbar" role="navigation" aria-label="Main navigation">
  <div class="topbar-left">
    <a href="campusfeed.html" class="topbar-brand" aria-label="Back to Feed">
      <img src="Images/logo.png" alt="Logo" class="topbar-logo" />
      <span class="topbar-name"><span class="t-crmc">CRMC</span><span class="t-cc">CampusConnect</span></span>
    </a>
  </div>
  <div class="topbar-right">
    <a href="campusfeed.html" class="btn-back-feed">
      <i class="fas fa-arrow-left"></i> Back to Feed
    </a>
  </div>
</nav>

<!-- ── PROFILE CONTENT ── -->
<div class="profile-page">

  <!-- Profile Header Card -->
  <div class="profile-header-card" id="profileHeaderCard">
    <div class="profile-header-loading">
      <i class="fas fa-spinner fa-spin"></i> Loading profile...
    </div>
  </div>

  <!-- Posts Section -->
  <div class="profile-posts-section">
    <div class="profile-posts-header">
      <h2 class="profile-posts-title" id="profilePostsTitle">Posts</h2>
      <span class="profile-posts-count" id="profilePostsCount"></span>
    </div>
    <div id="profilePostsFeed">
      <div class="profile-posts-loading">Loading posts...</div>
    </div>
  </div>

</div>

<!-- ── EDIT PROFILE MODAL ── -->
<div class="modal-overlay" id="editProfileModal" hidden role="dialog" aria-modal="true" aria-labelledby="editProfileTitle">
  <div class="modal edit-profile-modal">
    <button class="modal-close" id="closeEditProfile" aria-label="Close"><i class="fas fa-times"></i></button>
    <h2 class="edit-profile-title" id="editProfileTitle"><i class="fas fa-pen"></i> Edit Profile</h2>

    <div class="edit-profile-form">
      <!-- Avatar upload section -->
      <div class="edit-avatar-section">
        <div class="edit-avatar-preview" id="editAvatarPreview">
          <!-- filled by JS -->
        </div>
        <label for="avatarFileInput" class="edit-avatar-upload-btn">
          <i class="fas fa-camera"></i> Change Photo
        </label>
        <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" />
        <button type="button" class="edit-avatar-remove-btn" id="removeAvatarBtn" style="display:none;">
          <i class="fas fa-trash"></i> Remove Photo
        </button>
        <span class="edit-avatar-hint">Max 2MB · JPG, PNG</span>
      </div>

      <div class="edit-field">
        <label for="editBio">Bio <span style="color:var(--gray-400);font-weight:400;">(optional)</span></label>
        <textarea id="editBio" rows="4" placeholder="Tell others a bit about yourself..."></textarea>
        <div class="edit-bio-count"><span id="bioCharCount">0</span>/150</div>
      </div>
    </div>

    <div class="edit-profile-footer">
      <button class="edit-cancel-btn" id="cancelEditProfile">Cancel</button>
      <button class="edit-save-btn" id="saveEditProfile">
        <i class="fas fa-check"></i> Save Changes
      </button>
    </div>
  </div>
</div>

<script src="profile.js"></script>
</body>
</html>
