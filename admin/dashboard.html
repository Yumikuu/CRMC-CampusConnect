<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — CRMC CampusConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>
</head>
<body>

<!-- ── SIDEBAR ── -->
<aside class="admin-sidebar">
  <div class="sidebar-header">
    <img src="../Images/logo.png" alt="CRMC Logo" class="sidebar-logo" />
    <div class="sidebar-brand">
      <span class="brand-crmc">CRMC</span>
      <span class="brand-cc">CampusConnect</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="dashboard.html" class="nav-item active">
      <i class="fas fa-chart-line"></i>
      <span>Dashboard</span>
    </a>
    <a href="users.html" class="nav-item">
      <i class="fas fa-users"></i>
      <span>Users</span>
    </a>
    <a href="posts.html" class="nav-item">
      <i class="fas fa-newspaper"></i>
      <span>Posts</span>
    </a>
    <a href="moderation.html" class="nav-item">
      <i class="fas fa-flag"></i>
      <span>Moderation</span>
    </a>
    <a href="analytics.html" class="nav-item">
      <i class="fas fa-chart-bar"></i>
      <span>Analytics</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="nav-item nav-logout" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i>
      <span>Logout</span>
    </button>
  </div>
</aside>

<!-- ── MAIN CONTENT ── -->
<main class="admin-main">
  
  <!-- Top Bar -->
  <header class="admin-topbar">
    <h1 class="page-title">Dashboard</h1>
    <div class="topbar-right">
      <div class="admin-profile">
        <div class="admin-avatar" id="adminAvatar">AD</div>
        <div>
          <div class="admin-name" id="adminName">Admin User</div>
          <div class="admin-role">Administrator</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Stats Cards -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon" style="background: rgba(107,15,26,.1); color: var(--maroon);">
        <i class="fas fa-users"></i>
      </div>
      <div class="stat-content">
        <div class="stat-value" id="totalUsers">-</div>
        <div class="stat-label">Total Users</div>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon" style="background: rgba(59,130,246,.1); color: #2563eb;">
        <i class="fas fa-newspaper"></i>
      </div>
      <div class="stat-content">
        <div class="stat-value" id="totalPosts">-</div>
        <div class="stat-label">Total Posts</div>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon" style="background: rgba(34,197,94,.1); color: #16a34a;">
        <i class="fas fa-comments"></i>
      </div>
      <div class="stat-content">
        <div class="stat-value" id="totalComments">-</div>
        <div class="stat-label">Total Comments</div>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-icon" style="background: rgba(239,68,68,.1); color: #dc2626;">
        <i class="fas fa-flag"></i>
      </div>
      <div class="stat-content">
        <div class="stat-value" id="flaggedPosts">-</div>
        <div class="stat-label">Flagged Posts</div>
      </div>
    </div>
  </div>

  <!-- Recent Activity -->
  <div class="content-grid">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Recent Posts</h2>
        <a href="posts.html" class="card-link">View all →</a>
      </div>
      <div class="card-body">
        <div id="recentPosts" class="activity-list">
          <div class="loading">Loading...</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Recent Users</h2>
        <a href="users.html" class="card-link">View all →</a>
      </div>
      <div class="card-body">
        <div id="recentUsers" class="activity-list">
          <div class="loading">Loading...</div>
        </div>
      </div>
    </div>
  </div>

</main>

<script src="admin.js"></script>
</body>
</html>
